# Конфиг источников конвейера — 3 города теста
# Собрано стратегической сессией 2026-08-20 (TGStat региональные подборки + t.me превью + поиск).
# Статусы: verified — адрес подтверждён; resolve — цель известна, точный адрес/username
#   найти в фазе верификации (юзербот: поиск ТГ / вступление по инвайту; VK API: groups.search);
#   dormant — адрес верный, но источник перестал публиковать: в конвейер не берём,
#   запись держим, чтобы не искать его заново и вернуть, если оживёт;
#   no_feed — сайт живой, но RSS не отдаёт (нужен HTML-парсинг — отдельная задача);
#   unreachable — адрес известен, но не открывается с нашего IP (управление из-за
#   рубежа; решение — RU-прокси или отказ от источника, вопрос вынесен на ревью).
# Собирается ТОЛЬКО verified. Итоги проверки лент — 02.09.2026, scripts/verify_sources.py.
# RSS-адреса лент уточнить при реализации (обычно /rss, /feed; проверить доступность).
# Подписчики указаны на дату сбора — для приоритизации, не для логики.

defaults:
  poll_vk_seconds: 180
  poll_rss_seconds: 420
  dedup_window_hours: 48

